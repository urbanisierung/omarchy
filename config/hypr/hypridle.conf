general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # to avoid having to press a key twice to turn on the display.

    # Turn off the screen immediately when the session locks.
    on_lock_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    # Safety net: always power the display back on when the session unlocks,
    # so a blind password unlock can never leave you on a black screen.
    on_unlock_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 300                                      # 5min
    on-timeout = loginctl lock-session                 # lock screen when timeout has passed
}

listener {
    timeout = 1                                        # arm quickly to detect activity
    on-timeout = :                                     # no-op to mark idle event
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r
    ignore_inhibit = true                              # ensure activity wakes display even if inhibited
}

listener {
    timeout = 330                                      # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'                   # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r # screen on when activity is detected
}