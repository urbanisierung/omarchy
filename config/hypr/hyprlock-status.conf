# Shared by the base config and every theme; $lock_text matches the input field.
# Dark backplates keep theme text readable even over white wallpaper.
shape {
    monitor =
    size = 640, 96
    color = rgba(15,18,24,0.75)
    rounding = 12
    border_size = 0
    position = 0, 275
    halign = center
    valign = center
    zindex = 0
}

shape {
    monitor =
    size = 360, 120
    color = rgba(15,18,24,0.75)
    rounding = 16
    border_size = 0
    position = 0, 150
    halign = center
    valign = center
    zindex = 0
}

shape {
    monitor =
    size = 480, 56
    color = rgba(15,18,24,0.75)
    rounding = 12
    border_size = 0
    position = 0, -100
    halign = center
    valign = center
    zindex = 0
}

shape {
    monitor =
    size = 720, 100
    color = rgba(15,18,24,0.75)
    rounding = 12
    border_size = 0
    position = 0, 24
    halign = center
    valign = bottom
    zindex = 0
}

label {
    monitor =
    text = cmd[update:60000] python3 ~/.local/share/omarchy/bin/omarchy-lock-status calendar
    color = $lock_text
    font_family = CaskaydiaMono Nerd Font
    font_size = 18
    text_align = center
    position = 0, 275
    halign = center
    valign = center
    shadow_passes = 2
    zindex = 1
}

label {
    monitor =
    text = $TIME
    color = $lock_text
    font_family = CaskaydiaMono Nerd Font
    font_size = 64
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 2
    zindex = 1
}

label {
    monitor =
    text = cmd[update:10000] python3 ~/.local/share/omarchy/bin/omarchy-lock-status duration
    color = $lock_text
    font_family = CaskaydiaMono Nerd Font
    font_size = 18
    position = 0, -100
    halign = center
    valign = center
    shadow_passes = 2
    zindex = 1
}

label {
    monitor =
    text = cmd[update:10000] python3 ~/.local/share/omarchy/bin/omarchy-lock-status battery
    color = $lock_text
    font_family = CaskaydiaMono Nerd Font
    font_size = 16
    position = 0, 75
    halign = center
    valign = bottom
    shadow_passes = 2
    zindex = 1
}

label {
    monitor =
    text = cmd[update:10000] python3 ~/.local/share/omarchy/bin/omarchy-lock-status system
    color = $lock_text
    font_family = CaskaydiaMono Nerd Font
    font_size = 16
    position = 0, 40
    halign = center
    valign = bottom
    shadow_passes = 2
    zindex = 1
}
